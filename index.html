<!DOCTYPE html>
<html>
<head>
  <title>🤍 Safe Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
    .box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 16px; }
    button { background: #4a6fa5; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #3a5a8a; }
  </style>
</head>
<body>

  <h1>🤍 Safe Space</h1>
  <p>A gentle place to say what's on your heart</p>

  <div class="box">
    <h2>✉️ Write a Sorry Letter</h2>
    <textarea placeholder="Write what you truly feel... be honest, be kind..."></textarea>
    <br><br>
    <button>Generate Share Link</button>
  </div>

  <div class="box">
    <h2>🧱 Confession Wall</h2>
    <p>Coming soon — share anonymously, no judgment 💫</p>
  </div>

  <div class="box">
    <h2>🎮 Kindness Game</h2>
    <p>Coming soon — small daily quests to grow together 🌱</p>
  </div>

</body>
</html>
